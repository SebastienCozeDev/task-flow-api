services:
  api-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile-dev
    container_name: taskflow-api-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${PORT}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/api/node_modules
    command: npm run start:dev -w apps/api
    depends_on:
      - postgres
    networks:
      - internal
      - web

  api-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: taskflow-api-prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - postgres
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-web"
      - "traefik.http.routers.taskflow-api.rule=Host(`${PROD_DOMAIN}`)"
      - "traefik.http.routers.taskflow-api.entrypoints=websecure"
      - "traefik.http.routers.taskflow-api.tls.certresolver=myresolver"
      - "traefik.http.routers.taskflow-api.service=taskflow-api-service"
      - "traefik.http.services.taskflow-api-service.loadbalancer.server.port=3000"
      - "traefik.http.routers.taskflow-api-http.rule=Host(`${PROD_DOMAIN}`)"
      - "traefik.http.routers.taskflow-api-http.entrypoints=web"
      - "traefik.http.routers.taskflow-api-http.middlewares=to-https"
      - "traefik.http.middlewares.to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.to-https.redirectscheme.permanent=true"
  
  postgres:
    profiles: ["dev", "prod"]   # /!\ Do not use the same postgres container for both environments
    image: postgres:17
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  internal:
    external: true
    name: shared-internal
  web:
    external: true
    name: shared-web

volumes:
  postgres-data:
